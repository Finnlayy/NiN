# ============================================================================
# Neu -- Orchestrator-Kern (Protokoll 1.2)
#
# Die Laufzeit hat **keine** Abhaengigkeiten: Python 3.11+ Standardbibliothek.
# Alles unter [project.optional-dependencies] und in den tool-Abschnitten ist
# Entwicklungswerkzeug und wird fuer den Betrieb nicht installiert.
# ============================================================================

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neu-orchestrator"
version = "0.2.0"
description = "Selbsterhaltende Agenten-Architektur: Kernel, Orchestrator und Limbs ueber ein exaktes JSON-Protokoll (1.2)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Neu Core" }]
keywords = ["orchestrator", "agents", "protocol", "stdlib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []  # bewusst leer: Stdlib-only ist eine Architekturentscheidung

[project.optional-dependencies]
dev = ["ruff>=0.16", "mypy>=1.11"]

[project.scripts]
neu = "orchestrator.cli:main"

[project.urls]
Homepage = "https://github.com/Finnlayy/NIO"

[tool.setuptools]
# Nur die Python-Pakete; src/, evals/, frontend/ gehoeren zum Legacy-Harness.
packages = ["core", "orchestrator", "limbs"]

# ----------------------------------------------------------------------------
# Lint / Format: ruff
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["src", "evals", "frontend", "runtime", "workspace"]

[tool.ruff.lint]
# E501 (Zeilenlaenge) bleibt aus: Event-Payloads und Protokoll-Literale sind
# absichtlich in einer Zeile lesbar gehalten. Umbruch wuerde die JSON-Form
# zerhacken, ohne den Code verstaendlicher zu machen.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests duerfen lange, sprechende Methodennamen und bewusst redundante Asserts haben.
"tests/*" = ["SIM", "RET", "B011"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# ----------------------------------------------------------------------------
# Typen: mypy
# ----------------------------------------------------------------------------
# Pragmatisch, aber nicht zahm: Alle Koerper werden geprueft, implizite Optionals
# und redundante Casts sind Fehler. Vollstaendig strikte Signaturen folgen mit
# Phase 3 (Ouroboros), wenn die Selbstmodifikation die Limb-Grenzen haertet.
[tool.mypy]
python_version = "3.11"
files = ["core", "orchestrator", "limbs"]
exclude = ["^(src|evals|frontend)/"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
extra_checks = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
