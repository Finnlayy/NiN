name: omega-architect
base: core22
version: '3.2.0'
summary: Lead Systems & Quantitative Infrastructure Engineer
description: |
  Full codebase migration and sovereign pure-Python implementation of Project "Architect" based on the OMEGA & NIO architecture.
grade: stable
confinement: strict

apps:
  omega-architect:
    command: run_terminal.sh
    environment:
      PYTHONPATH: $SNAP/lib/python3.11/site-packages:$SNAP

parts:
  architect:
    plugin: python
    source: .
    python-packages:
      - fastapi
      - PyQt6
      - pyqtgraph
      - numpy
      - scipy
      - vectorbt
      - torch
      - onnx
      - qdrant-client
      - pydantic
      - pydantic-settings
      - ccxt
      - google-genai
      - scikit-learn
      - hdbscan
