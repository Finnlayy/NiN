name: Vercel Deployment Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  build:
    name: Vercel build (vite build)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (mirrors vercel.json buildCommand)
        run: npx vite build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          ls dist/assets/*.js >/dev/null || { echo "no JS bundle emitted"; exit 1; }
          echo "Build output OK"

      - name: Verify Vercel API functions
        run: |
          test -f api/kraken/status.js || { echo "api/kraken/status.js missing"; exit 1; }
          node --check api/kraken/status.js
          test -f api/handler.ts || { echo "api/handler.ts missing"; exit 1; }
          echo "API functions OK"

      - name: Validate vercel.json
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"

  smoke:
    name: Smoke-test live deployment
    runs-on: ubuntu-latest
    needs: build
    # Only meaningful for the deployed site after a main push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check production site serves a fresh bundle and live ticker
        run: |
          set -euo pipefail
          SITE="https://ni-n.vercel.app"

          # Vercel deploys take ~1-2 min; retry generously
          for i in $(seq 1 30); do
            HTML=$(curl -fsS "$SITE/" && break || true)
            if [ -n "${HTML:-}" ]; then break; fi
            sleep 10
          done
          test -n "${HTML:-}" || { echo "site did not respond"; exit 1; }

          echo "$HTML" | grep -qE 'assets/index-[^"]+\.js' \
            || { echo "no vite bundle reference in HTML"; exit 1; }

          STATUS=$(curl -fsS "$SITE/api/kraken/status")
          echo "$STATUS" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const j=JSON.parse(d);
              if(!j.ticker||!j.ticker.BTCUSD||typeof j.ticker.BTCUSD.last!=='number'){
                console.error('ticker.BTCUSD.last missing or not a number');process.exit(1);
              }
              console.log('Live BTC ticker OK:',j.ticker.BTCUSD.last);
            });"
